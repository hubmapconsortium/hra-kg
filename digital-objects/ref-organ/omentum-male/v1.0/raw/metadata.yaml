title: 3D reference organ for omentum, Male
description: |-
  This reference organ, omentum-male (https://humanatlas.io/3d-reference-library) was created based on the colon
  and small intestine data from the Visible Human Dataset, provided by the National Library of Medicine (Spitzer and Whitlock 2002).

  **Bibliography:**

  * Spitzer, Victor M., and David G. Whitlock. 2002. “The Visible Human Dataset: The Anatomical Platform for Human Simulation.” The Anatomical Record 253 (2): 49–57. <https://doi.org/10.1002/(SICI)1097-0185(199804)253:2<49::AID-AR8>3.0.CO;2-9>.
